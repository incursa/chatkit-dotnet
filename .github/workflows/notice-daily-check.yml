name: NOTICE Daily Check

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notice-check:
    runs-on: ubuntu-latest
    concurrency:
      group: notice-daily-check
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Regenerate NOTICE
        shell: pwsh
        run: pwsh -File scripts/compliance/update-notice.ps1

      - name: Detect NOTICE changes
        id: notice_diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- NOTICE.md)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit NOTICE refresh directly to main
        if: steps.notice_diff.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- NOTICE.md
          git commit -m "chore: refresh NOTICE.md"
          git push origin HEAD:main
