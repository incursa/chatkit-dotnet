name: ChatKit Runtime Upstream Sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-chatkit-runtime:
    runs-on: ubuntu-latest
    concurrency:
      group: chatkit-runtime-upstream-sync
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Incursa.OpenAI.ChatKit.AspNetCore/ClientApp/chatkit-runtime/package-lock.json

      - name: Sync ChatKit runtime npm dependency
        shell: pwsh
        run: ./tools/upstream-sync/Invoke-UpstreamChatKitRuntimeSync.ps1

      - name: Commit runtime update directly to main
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "ChatKit runtime is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync ChatKit runtime npm dependency"
          git push origin HEAD:main
