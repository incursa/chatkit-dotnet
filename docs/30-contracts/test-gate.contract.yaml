version: 2
domain: Incursa OpenAI ChatKit testing evidence
scope:
  solutionPath: Incursa.OpenAI.ChatKit.slnx
  includes:
    - src/**
    - tests/**
    - runsettings/**
    - scripts/quality/**
    - docs/**
    - .github/workflows/library-fast-quality.yml
    - .github/workflows/workbench-quality.yml
    - .github/workflows/testdocs.yml
  excludes:
    - src/**/bin/**
    - src/**/obj/**
    - tests/**/bin/**
    - tests/**/obj/**
    - artifacts/**
coverage:
  lineMin: 0.55
  branchMin: 0.50
  criticalFiles:
    - Actions.cs
    - Agents.cs
    - ChatKitServer.cs
    - ChatKitRequests.cs
    - ChatKitEvents.cs
    - ChatKitJson.cs
    - ChatKitPrimitives.cs
    - Store.cs
    - Widgets.cs
