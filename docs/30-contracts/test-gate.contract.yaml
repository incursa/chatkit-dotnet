artifacts:
  smokeResults: artifacts/test-results/smoke
  blockingResults: artifacts/test-results/blocking
  observationalResults: artifacts/test-results/observational
  advisoryResults: artifacts/test-results/advisory
  advisoryCoverage: artifacts/coverage/advisory
  normalizedQuality: artifacts/quality/testing
lanes:
  smoke:
    entrypoint: scripts/quality/run-smoke-tests.ps1
    policy: required
    intent: curated fast precheck across explicit Category=Smoke tests covering core serialization, routing, widget diffing, and ASP.NET Core endpoint mapping
  blocking:
    entrypoint: scripts/quality/run-blocking-tests.ps1
    policy: required
    intent: main CI-safe validation lane for the maintained ChatKit solution using non-Docker tests
  observational:
    entrypoint: scripts/quality/run-observational-tests.ps1
    policy: advisory
    intent: visible non-blocking KnownIssue tests
    currentState: no KnownIssue tests are currently authored in this repository
  advisory:
    entrypoint: scripts/quality/run-quality-evidence.ps1
    policy: advisory
    intent: broader confidence and Workbench evidence lane using advisory TRX plus package coverage artifacts for the core and ASP.NET Core ChatKit surfaces
related:
  docs:
    - docs/testing-operating-model.md
    - docs/testing-known-issues.md
    - docs/testing/README.md
    - tests/README.md
    - benchmarks/README.md
    - fuzz/README.md
    - docs/quality/library-hardening-baseline.md
    - docs/quality/repo-scope-boundary.md
  files:
    - runsettings/smoke.runsettings
    - runsettings/blocking.runsettings
    - runsettings/observational.runsettings
    - scripts/quality/run-smoke-tests.ps1
    - scripts/quality/run-blocking-tests.ps1
    - scripts/quality/run-observational-tests.ps1
    - scripts/quality/run-advisory-quality-tests.ps1
    - scripts/quality/run-quality-evidence.ps1
    - scripts/quality/run-workbench-evidence.ps1
    - scripts/quality/run-library-coverage.ps1
    - scripts/quality/run-library-mutation.ps1
    - scripts/quality/stryker/chatkit-core.stryker-config.json
    - scripts/quality/stryker/chatkit-aspnetcore.stryker-config.json
    - benchmarks/Incursa.OpenAI.ChatKit.Benchmarks.csproj
    - fuzz/Incursa.OpenAI.ChatKit.Fuzz.csproj
    - .github/workflows/library-fast-quality.yml
    - .github/workflows/workbench-quality.yml
    - .github/workflows/testdocs.yml
intentionalGaps:
  - subject: Empty observational KnownIssue lane
    rationale: The KnownIssue taxonomy and artifact path are standardized, but no current tests are intentionally left failing in automation.
  - subject: Advisory-only mutation execution
    rationale: Stryker configs are maintained for the public ChatKit packages, but mutation runs remain outside the default required CI lane and are not normalized into the Workbench summary.
  - subject: Fuzz campaigns remain separately operated
    rationale: SharpFuzz harnesses are maintained under fuzz/, but fuzzing is currently run as a dedicated boundary exercise instead of being folded into the routine quality sync.
  - subject: Benchmarks remain performance evidence, not functional evidence
    rationale: BenchmarkDotNet suites exist for selected hot paths, but performance baselines are tracked outside the Workbench functional quality report.
