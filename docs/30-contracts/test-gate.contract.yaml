    - WidgetDefinitions.cs
    - ChatKitAspNetCoreOptions.cs
    - ChatKitAspNetCoreServiceCollectionExtensions.cs
    - ChatKitEndpointRouteBuilderExtensions.cs
    - Errors.cs
    - TagHelpers/IncursaChatKitApiTagHelper.cs
    - TagHelpers/IncursaChatKitHostedTagHelper.cs
    - TagHelpers/IncursaChatKitTagHelper.cs
    - TagHelpers/IncursaChatKitTagHelperBase.cs
expectations:
  confidenceTarget: advisory confidence based on a required smoke precheck, the required non-Docker blocking lane, and advisory Workbench evidence from the curated advisory lane
  evidence:
    - inventory
    - results
    - coverage
